# 편집 설정 — 사용자가 직접 조정하는 값
# 잘못된 값은 `python -m pipeline validate` 가 거부한다.

timezone: Asia/Seoul

# 수집 시간창: 직전 발행 호의 end ~ 이번 호의 end (KST). 평소 24시간, 발행을 놓친 날이 있으면 그만큼 늘어난다.
# 실행 시각과 무관하게 이 경계로 자른다. 직전 호가 없으면 24시간, 오래 놓쳐도 max_hours 까지만.
window:
  end: "05:30"           # 10/20 부터 (그전 06:00). daily 예약은 이 시각 뒤로 둔다 (.github/workflows/daily.yml)
  max_hours: 72

publish_time: "05:40"

# 최종 점수 = 아래 가중치의 가중합 (각 지표는 0~1로 정규화된 값)
# S6 실측: 관심도 0.10 으로는 관심 설정을 극단(한 분야 100배)으로 바꿔도 실제 지면이 한 건도 달라지지 않았다
# → 0.25. 1면 톱은 관심도를 쓰지 않고, 다양성 30%·관심 상한 50% 가 따로 지켜지므로 쏠리지 않는다
weights:
  attention: 0.35    # 주목도
  importance: 0.30   # 중요도
  continuity: 0.10   # 연속성
  interest: 0.25     # 관심도 (1면 톱 선정에는 쓰지 않음)
  headline: 0.25     # 매체 머리기사: 그날 종이신문 1면·홈페이지 맨 위에 올린 매체들 (S14b, 사용자 요청)
  front_headline: 0.50  # 1면을 고를 때 머리기사 비중 (주목도 0.35·중요도 0.30 과 함께 → 1면에서는 머리기사가 가장 큼)

editing:
  total_articles: 60       # 하루 지면 기사 수 (S19d 40 → 60) (interests.yaml 의 daily_articles 가 있으면 그 값)
  diversity_ratio: 0.30    # 관심도와 무관하게 주목도 상위 이슈에 배정하는 비율
  interest_cap: 0.65       # 관심 분야 기사 비율 상한 (S21c "관심 기사 수 늘려줘": 0.50 → 0.65)
  continuity_min_days: 3   # 이 일수 이상 이어진 이슈는 최소 단신으로 노출
  continuity_max_ratio: 0.15  # 연속 보장은 지면의 15%까지·덜 보기 분야 제외 (S21c — 10/18호는 30/60 이 연속 보장)
  topic_max_ratio: {international: 0.4}   # 국제 기사는 지면의 40%까지 (S21c — 해외 매체가 많아 10/18 미리보기에서 국제 40/60)
  history_days: 14         # 연속성 계산에 쓰는 과거 일수
  section_min: 2           # 뉴스 면마다 최소 기사 수 (S23a — 10/18호 사회·과학 면 0건). 모자라면 그 면 분야의 다음 순위 기사로
  reserve: 80              # 예비 기사: 쪽이 남으면 단신으로 채움 (S15·S17e). S21c: 분야면이 더 받으므로 180 → 60 (10/18호는 예비 180건이 단신으로). S22b: 관련 기사로 옮기는 만큼 60 → 80 (10/18 iPad 끝 빈 쪽 1장)
  interest_cap_mode: driven  # driven: 관심도 덕분에 들어온 기사만 상한에 셈 / topic: 관심 분야 기사 전체

# 지면 순서와 지면별 최대 기사 수
# pages: 고정 쪽 수 (S15). 합 26쪽(펼침 13면 — S22c 분석·해설 2쪽 추가 — S19d "지면 좀 더 많이") — 짝수여야 펼침면이 맞는다.
# S21c(10/18호 "단신이 너무 많다"): 사회·과학 면을 새로, 관심면 확대, 단신 5 → 3쪽. 쪽에 다 못 들어간 기사는 단신으로, 남긴 쪽은 논평·단신이 쓴다
sections:
  - {id: front, title: "1면", max_articles: 5, pages: 2}
  - {id: politics, title: "정치·안보", max_articles: 9, pages: 3}
  - {id: economy, title: "경제·산업", max_articles: 9, pages: 3}
  - {id: international, title: "국제", max_articles: 12, pages: 4}
  - {id: society, title: "사회·과학", max_articles: 7, pages: 2}
  - {id: interest, title: "관심", max_articles: 14, pages: 3}
  - {id: analysis, title: "분석·해설", max_articles: 0, pages: 2}  # 매체가 쓴 분석·해설 기사 (S22c — AI 글 아님). 뉴스 기사 수에는 안 셈
  - {id: compare, title: "입장 비교", max_articles: 4}  # 따로 쪽 없음 — 해당 기사 아래에 입장 차이를 붙인다
  - {id: briefs, title: "단신", max_articles: 30, pages: 3}  # 다른 섹션에서 넘친 기사·예비 기사를 받음 (가로 한 줄 — S17e, 분야별 묶음 — S19c)
  - {id: opinion, title: "논평·사설", max_articles: 0, pages: 3}  # 뉴스 기사 수에는 안 셈 (사설은 모두, 칼럼은 10편까지)
  - {id: guide, title: "매체 성향 가이드·출처", max_articles: 0, pages: 1}

clustering:
  # S5 실측: MiniLM·mpnet·potion 은 한국어 짧은 문장 구별이나 다국어 연결이 약해 탈락 (docs-internal/cluster-review-*.md)
  model: multilingual-e5-large
  similarity_threshold: 0.4
  linkage: average
  lexical_weight: 0.5        # 같은 언어 쌍: 중심화 임베딩과 어휘 겹침을 반씩
  cross_lang_csls_min: 0.06  # 다른 언어 쌍: CSLS 이 값 이상이어야 묶임
  csls_k: 10
  # 일본어가 낀 쌍은 더 높게: 10/15호 검수에서 다국어 오류 3건이 모두 일본어 쌍(CSLS 0.071~0.079)
  # 검수 뒤 정한 값이라 시범 운영(S12)에서 새 날짜로 재검증 필요
  csls_min_by_lang: {ja: 0.09}

# 중요도: 분야 기본값 + 핵심 키워드 가산 (+ 다룬 국가 수)
importance:
  topic_weights:
    politics: 1.0
    economy: 1.0
    international: 0.9
    semis_ai: 0.8
    industry: 0.7
    society: 0.6
    science: 0.5
    incidents: 0.4
    lifestyle_culture: 0.3
    entertainment_sports: 0.2
  keywords: [전쟁, 미사일, 핵, 계엄, 탄핵, 금리, 정상회담, 참사, 지진, 쿠데타, 테러, 관세, 사망자,
             war, missile, nuclear, coup, summit, earthquake, tariff, killed, ceasefire]
  keyword_bonus: 0.15

# 사진: RSS 대표 이미지만, 원 주소로 표시. 순위를 바꾸지 않고 정해진 자리에만
photos:
  front: 5        # 1면 기사마다 (이미지가 있으면)
  per_section: 3  # 섹션 위쪽 기사 3건까지

# LLM 훅 — Claude 구독(Claude Code CLI)으로 호출. 토큰이 없거나 실패하면 무토큰으로 발행.
# 1) 이슈 분석(S14): 지면 상위 analysis_issues 개 묶음의 기사 본문을 발행 때 읽어(저장 안 함)
#    요약·배경·쟁점·매체별 관점을 쓴다. analysis_batch 개씩 묶어 한 번에 (40개 → 8회)
# 2) 나머지 기사: 입장 차이 요약·영어 기사 한국어 요약·비영어 제목 번역 (model, 여러 건씩 묶어서)
llm:
  enabled: true
  model: haiku
  max_calls_per_day: 62   # (S31b: 경제 해설 opus 3건씩 최대 10회 더해 50 → 62) 호 단위(S21a). 폭주 방지용 — 같은 호를 하루 여러 번 다시 발행하면 나눠 씀. 실제 사용량·API 환산 금액은 발행 로그 LLM 줄(S23c). 분석 14 + 분야 분류 4 + 관련 기사 2 + 비교 1 + 요약·번역 6까지 + 같은 사건 2 + 사설 제목 1 + 분석 요약 1 + 헤드라인 1 ≈ 32, 재시도 여유 (S22)
  timeout_sec: 120
  analysis_model: sonnet
  analysis_issues: 70   # 지면 60건 + 예비 10건 (S19d, 14회)
  analysis_batch: 5
  analysis_timeout_sec: 300
  econ_model: opus        # 경제 심화 해설 (S31b, 14차 요청 — 시안에서 sonnet·opus 비교 후 사용자 "opus로 진행")
  econ_issues: 30         # 경제·산업·반도체 분야 지면 기사 (예비 제외) 점수 순 30건까지
  econ_batch: 3
  econ_timeout_sec: 600
