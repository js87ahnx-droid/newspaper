# 아침 발행: 05:33 KST 본 실행 + 08:29 까지 예비 실행 여러 번 (Actions 예약은 늦거나 빠질 수 있어서).
# 10/19 에는 06:00·06:30 예약이 둘 다 시작조차 안 됐고 수집 예약도 2~3시간 늦었다 — 붐비는 정각·30분을 피한다.
# 시간창이 05:30 에 닫히므로(config.yaml window.end) 그 뒤에 시작해야 오늘 호가 된다.
# 이미 발행된 호면 check 단계에서 바로 끝난다 (몇 초). 지면은 암호화(StaticCrypt)한 뒤에만 커밋한다.
#
# 필요한 저장소 Secrets
#   NEWS_PASSWORD            지면 비밀번호 (필수 — 없으면 발행하지 않음)
#   CLAUDE_CODE_OAUTH_TOKEN  `claude setup-token` 으로 만든 구독 토큰 (선택 — 없으면 LLM 없이 발행)
#   READER_URL, READER_KEY   원문 재배열 중계 서버 주소·접근 키 (선택 — 없으면 원문 링크만, S17·worker/)
name: daily

on:
  schedule:
    - cron: "33 20 * * *"   # 05:33 KST
    - cron: "7 21 * * *"    # 06:07 KST (예비)
    - cron: "41 21 * * *"   # 06:41 KST (예비)
    - cron: "19 22 * * *"   # 07:19 KST (예비)
    - cron: "53 22 * * *"   # 07:53 KST (예비)
    - cron: "29 23 * * *"   # 08:29 KST (예비)
  workflow_dispatch:
    inputs:
      date:
        description: "호 날짜 YYYY-MM-DD (비우면 가장 최근에 끝난 시간창)"
        required: false
      force:
        description: "이미 발행된 호도 다시 만들기"
        type: boolean
        default: false
      render_only:
        description: "지면만 다시 그리기 (수집·편집·AI 호출 없이, force 와 함께)"
        type: boolean
        default: false

concurrency:
  group: newspaper-data
  cancel-in-progress: false

permissions:
  contents: write   # 지면(docs/)·연속성 기록(data/history) 커밋

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/archive
      - id: check
        env:
          SKIP_IF_PUBLISHED: ${{ (github.event_name == 'schedule' || !inputs.force) && '1' || '0' }}
          EDITION_DATE: ${{ inputs.date }}
        run: |
          # 가장 최근에 닫힌 시간창(05:30 KST, config.yaml window.end) 의 호 — daily.sh 의 current_edition 과 같은 날짜
          DATE="${EDITION_DATE:-$(TZ=Asia/Seoul date -d '5 hours 30 minutes ago' +%F)}"
          if [ "$SKIP_IF_PUBLISHED" = "1" ] && [ -f "docs/archive/$DATE/index.html" ]; then
            echo "$DATE 호는 이미 발행됨 — 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}   # 단계의 if 에서는 secrets 를 직접 못 쓴다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Claude Code CLI (구독 토큰이 있을 때만)
        if: env.HAS_TOKEN == 'true'
        # 버전 고정 (S29d 점검: 토큰·비밀번호·쓰기 권한이 있는 작업). 10/22 마지막 성공 발행 때 버전. 올릴 땐 일부러
        run: npm install -g @anthropic-ai/claude-code@2.1.308
      - name: 누적분 불러오기
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: 임베딩 모델 캐시
        uses: actions/cache@v4
        with:
          path: models
          key: models-multilingual-e5-large-v1
      - name: 발행
        env:
          NEWS_PASSWORD: ${{ secrets.NEWS_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          READER_URL: ${{ secrets.READER_URL }}
          READER_KEY: ${{ secrets.READER_KEY }}
          EDITION_DATE: ${{ inputs.date }}
          SKIP_IF_PUBLISHED: ${{ (github.event_name == 'schedule' || !inputs.force) && '1' || '0' }}
          RENDER_ONLY: ${{ inputs.render_only && '1' || '0' }}
        run: bash scripts/daily.sh
      - name: 누적분 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
      - name: 실행 보고 (로그·요약)
        if: always()
        run: |
          cat data/run-report.json 2>/dev/null || echo "보고 없음"
          echo "### 발행 ${{ job.status }} — $(TZ=Asia/Seoul date '+%F %H:%M KST')" >> "$GITHUB_STEP_SUMMARY"
      - name: 커밋·푸시
        run: |
          git config user.name "newspaper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/history .staticrypt.json
          if [ -f data/interests-learned.json ]; then git add data/interests-learned.json; fi   # 주간 관심 학습값 (S30b)
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "발행: $(ls -1 docs/archive | grep -E '^[0-9]{4}-' | sort | tail -1)"
          # 실행 중에 main 에 다른 커밋이 올라오면 push 가 거절되어 그날 호가 버려졌다 (S29d 점검) → rebase 후 3번까지
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || { git rebase --abort; break; }
            sleep $((i * 5))
          done
          echo "::error::발행 결과를 push 하지 못함" ; echo "**push 실패 — 그날 호가 저장소에 없음**" >> "$GITHUB_STEP_SUMMARY"; exit 1
