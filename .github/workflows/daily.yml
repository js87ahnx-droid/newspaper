# 아침 발행: 06:00 KST 본 실행 + 06:30 KST 예비 실행 (Actions 예약은 늦거나 빠질 수 있어서).
# 시간창이 06:00 에 닫히므로 그 뒤에 시작해야 오늘 호가 된다 (05:55 에 시작하면 어제 호로 판정).
# 예비 실행은 이미 발행된 호면 건너뛴다. 지면은 암호화(StaticCrypt)한 뒤에만 커밋한다.
#
# 필요한 저장소 Secrets
#   NEWS_PASSWORD            지면 비밀번호 (필수 — 없으면 발행하지 않음)
#   CLAUDE_CODE_OAUTH_TOKEN  `claude setup-token` 으로 만든 구독 토큰 (선택 — 없으면 LLM 없이 발행)
name: daily

on:
  schedule:
    - cron: "0 21 * * *"    # 06:00 KST
    - cron: "30 21 * * *"   # 06:30 KST (예비)
  workflow_dispatch:
    inputs:
      date:
        description: "호 날짜 YYYY-MM-DD (비우면 가장 최근에 끝난 시간창)"
        required: false
      force:
        description: "이미 발행된 호도 다시 만들기"
        type: boolean
        default: false

concurrency:
  group: newspaper-data
  cancel-in-progress: false

permissions:
  contents: write   # 지면(docs/)·연속성 기록(data/history) 커밋

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}   # 단계의 if 에서는 secrets 를 직접 못 쓴다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Claude Code CLI (구독 토큰이 있을 때만)
        if: env.HAS_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: 누적분 불러오기
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: 임베딩 모델 캐시
        uses: actions/cache@v4
        with:
          path: models
          key: models-multilingual-e5-large-v1
      - name: 발행
        env:
          NEWS_PASSWORD: ${{ secrets.NEWS_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EDITION_DATE: ${{ inputs.date }}
          SKIP_IF_PUBLISHED: ${{ (github.event_name == 'schedule' || !inputs.force) && '1' || '0' }}
        run: bash scripts/daily.sh
      - name: 누적분 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
      - name: 실행 보고 (로그)
        if: always()
        run: cat data/run-report.json 2>/dev/null || echo "보고 없음"
      - name: 커밋·푸시
        run: |
          git config user.name "newspaper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/history .staticrypt.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "발행: $(ls -1 docs/archive | grep -E '^[0-9]{4}-' | sort | tail -1)"
          git push
