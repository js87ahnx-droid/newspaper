# 아침 발행: Cloudflare 예약(worker/src/morning.js)이 05:33·06:03·06:33 KST 에 부르고, 여기 예약은 07:03·07:33 예비 (S45).
# 10/19 에는 06:00·06:30 예약이 둘 다 시작조차 안 됐고 수집 예약도 2~3시간 늦었다 — 붐비는 정각·30분을 피한다.
# 시간창이 05:30 에 닫히므로(config.yaml window.end) 그 뒤에 시작해야 오늘 호가 된다.
# 이미 발행된 호면 check 단계에서 바로 끝난다 (몇 초). 지면은 암호화(StaticCrypt)한 뒤에만 커밋한다.
#
# 필요한 저장소 Secrets
#   NEWS_PASSWORD            지면 비밀번호 (필수 — 없으면 발행하지 않음)
#   CLAUDE_CODE_OAUTH_TOKEN  `claude setup-token` 으로 만든 구독 토큰 (선택 — 없으면 LLM 없이 발행)
#   READER_URL, READER_KEY   원문 재배열 중계 서버 주소·접근 키 (선택 — 없으면 원문 링크만, S17·worker/)
name: daily

on:
  schedule:
    # S45: 발행은 Cloudflare 예약(05:33·06:03·06:33)과 수집 끝 호출이 맡는다. 여기는 그 뒤 +30분·+1시간 예비 2개만
    # (실측 10/25~11/13: GitHub 예약은 3~6시간 늦게 도착하고, 이미 발행된 호면 몇 초 만에 끝남)
    - cron: "3 22 * * *"    # 07:03 KST (예비)
    - cron: "33 22 * * *"   # 07:33 KST (예비)
  workflow_dispatch:
    inputs:
      date:
        description: "호 날짜 YYYY-MM-DD (비우면 가장 최근에 끝난 시간창)"
        required: false
      force:
        description: "이미 발행된 호도 다시 만들기"
        type: boolean
        default: false
      render_only:
        description: "지면만 다시 그리기 (수집·편집·AI 호출 없이, force 와 함께)"
        type: boolean
        default: false
      reset_budget:
        description: "이 호의 AI 호출 수를 0으로 (거절된 호출로 상한이 찼을 때 다시 만들기, force 와 함께)"
        type: boolean
        default: false

concurrency:
  group: newspaper-data
  cancel-in-progress: false

permissions:
  contents: write   # 지면(docs/)·연속성 기록(data/history) 커밋
  actions: read     # 누적분 캐시가 있는지 확인 (S35a raw_cache_guard)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 기다린 실행도 최신 main 을 본다 (S39). 기본값은 호출 시점 커밋이라, 11/5 #222 가 20분 기다린 뒤 #221 이 올린 호를 못 보고 다시 만들었다
          ref: main
          sparse-checkout: docs/archive
      - id: check
        env:
          SKIP_IF_PUBLISHED: ${{ (github.event_name == 'schedule' || !inputs.force) && '1' || '0' }}
          EDITION_DATE: ${{ inputs.date }}
        run: |
          # 가장 최근에 닫힌 시간창(05:30 KST, config.yaml window.end) 의 호 — daily.sh 의 current_edition 과 같은 날짜
          # 330분 = 5시간 30분 ('5 hours 30 minutes ago' 는 "ago" 가 분에만 붙어 4시간 30분 뒤가 된다, S39)
          DATE="${EDITION_DATE:-$(TZ=Asia/Seoul date -d '330 minutes ago' +%F)}"
          if [ "$SKIP_IF_PUBLISHED" = "1" ] && [ -f "docs/archive/$DATE/index.html" ]; then
            echo "$DATE 호는 이미 발행됨 — 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}   # 단계의 if 에서는 secrets 를 직접 못 쓴다
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # check 와 같이 최신 main (S39) — daily.sh 의 재확인도 먼저 올라간 호를 본다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Claude Code CLI (구독 토큰이 있을 때만)
        if: env.HAS_TOKEN == 'true'
        # 버전 고정 (S29d 점검: 토큰·비밀번호·쓰기 권한이 있는 작업). 10/22 마지막 성공 발행 때 버전. 올릴 땐 일부러
        run: npm install -g @anthropic-ai/claude-code@2.1.308
      - name: 누적분 불러오기
        id: raw
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: 불러오기 확인 (S35a — 못 불러왔으면 발행은 하되 빈 누적분을 저장하지 않는다)
        id: rawguard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/raw_cache_guard.sh "${{ steps.raw.outputs.cache-matched-key }}"
      - name: 임베딩 모델 캐시
        uses: actions/cache@v4
        with:
          path: models
          key: models-multilingual-e5-large-v1
      - name: 발행
        id: publish
        env:
          NEWS_PASSWORD: ${{ secrets.NEWS_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          READER_URL: ${{ secrets.READER_URL }}
          READER_KEY: ${{ secrets.READER_KEY }}
          EDITION_DATE: ${{ inputs.date }}
          SKIP_IF_PUBLISHED: ${{ (github.event_name == 'schedule' || !inputs.force) && '1' || '0' }}
          RENDER_ONLY: ${{ inputs.render_only && '1' || '0' }}
          RESET_BUDGET: ${{ inputs.reset_budget && '1' || '0' }}
        run: bash scripts/daily.sh
      - name: 실행 보고 (로그·요약)
        if: always()
        run: |
          cat data/run-report.json 2>/dev/null || echo "보고 없음"
          echo "### 발행 ${{ job.status }} — $(TZ=Asia/Seoul date '+%F %H:%M KST')" >> "$GITHUB_STEP_SUMMARY"
      - name: 커밋·푸시
        id: push
        env:
          EDITION: ${{ steps.publish.outputs.date }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        # 올리기 전에 원격 최신을 받아 rebase, 3번까지. 같은 호가 이미 있으면 덮어쓰지 않고 건너뜀, 실패는 원인(충돌·권한·기타)을 표시
        run: bash scripts/push_edition.sh "$EDITION" "$FORCE"
      - name: 누적분 저장
        # 푸시 뒤에: 같은 호를 건너뛰면 그 실행의 edition.json 등이 발행본을 덮지 않게 저장하지 않는다 (S39).
        # 발행·푸시가 실패하면 지금처럼 저장한다 — 다시 만들 때 AI 결과를 재사용 (S35a 조건은 그대로)
        if: always() && steps.rawguard.outputs.save == 'true' && steps.push.outputs.result != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
