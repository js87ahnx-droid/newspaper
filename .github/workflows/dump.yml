# 편집 데이터 내려받기 (S51, 2026-11-17 사용자 허용): 발행 캐시의 <호>.edition.json 을 비밀값 DUMP_KEY 로 암호화해 1일짜리 아티팩트로.
# 공개 저장소라 평문은 올리지 않는다. 지면 비밀번호(NEWS_PASSWORD)는 쓰지 않는다. 손으로만 실행
name: dump
on:
  workflow_dispatch:
    inputs:
      date:
        description: "호 날짜 YYYY-MM-DD"
        required: true
permissions:
  contents: read
  actions: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 누적분 불러오기
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-dump-${{ github.run_id }}
          restore-keys: raw-
      - name: 암호화
        env:
          DUMP_KEY: ${{ secrets.DUMP_KEY }}
          D: ${{ inputs.date }}
        run: |
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "날짜 형식"; exit 1; }
          [ -n "$DUMP_KEY" ] || { echo "DUMP_KEY 없음"; exit 1; }
          test -f "data/raw/$D.edition.json" || { echo "data/raw/$D.edition.json 없음"; ls data/raw | tail -20; exit 1; }
          tar czf dump.tgz "data/raw/$D.edition.json" $(ls "data/raw/$D.json" 2>/dev/null)
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:DUMP_KEY -in dump.tgz -out dump.tgz.enc
          rm dump.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: dump-${{ inputs.date }}
          path: dump.tgz.enc
          retention-days: 1
