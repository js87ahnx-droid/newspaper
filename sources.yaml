# 매체 목록 — 2026-10-15 실측 결과 반영 (근거: docs-internal/source-audit.md)
# lean(성향 라벨)은 일반적 평가일 뿐 기사마다 다를 수 있다. 사용자가 고쳐 써도 된다.
#   lean: 보수 | 중도 | 진보 | 경제지 | 통신·공영
#   type: 종합지 | 경제지 | 방송 | 통신 | 국제
# enabled: true  — 공식 피드가 동작함
# enabled: false — 공식 피드가 없거나 막혀 Google 뉴스 대체 경로만 있음 (사용자 승인 대기, D6)

