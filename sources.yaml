# 매체 목록 — 2026-10-15 실측 결과 반영 (근거: docs-internal/source-audit.md)
# lean(성향 라벨)은 일반적 평가일 뿐 기사마다 다를 수 있다. 사용자가 고쳐 써도 된다.
#   lean: 보수 | 중도 | 진보 | 경제지 | 통신·공영 | 관영
#   type: 종합지 | 경제지 | 방송 | 통신 | 국제
# enabled: true  — 공식 피드가 동작함
# section: opinion — 논평·사설 피드 (2026-10-16 사용자 요청, 실측: docs-internal/source-audit.md 4장). 일반 뉴스와 따로 다룬다
# headline: 그날 머리기사를 얻는 곳(S14b) — naver_a1(네이버 신문 A1면)·feed(편집 순서 머리 피드)·homepage(홈페이지 링크 순서). 앞에서부터 시도
# kind: google_news — 공식 피드가 없거나 막혀 Google 뉴스 매체 한정 검색으로 대체 (2026-10-15 사용자 승인, D6)

