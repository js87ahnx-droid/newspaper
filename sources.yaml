    enabled: true
    site: [politico.com]   # 기사 주소 도메인 (원문 재배열 중계 허용목록, S17)
    reader: false   # 실측 2026-10-17(S20c): 기사·홈페이지 봇 차단(403), 중계로도 본문 앞 5문단 안팎뿐 → 원문 링크로. 홈페이지 403 → 헤드라인 없음
    langs: [en]
